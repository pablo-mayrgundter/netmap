[project]
name = "netmap"
version = "0.1.0"
description = "Maps of cyberspace: AS-level internet maps in cyber (LGL), geo and hybrid layouts"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "igraph>=0.11",
  "pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
netmap = "netmap.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["netmap*"]

[tool.setuptools.package-data]
"netmap.native" = ["*.c", "Makefile"]
