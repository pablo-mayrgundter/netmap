<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>netmap — maps of cyberspace</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="map"></div>
    <div id="globe" hidden></div>

    <!-- top-left: the controls card (or its icon) and the search toolbar beside it -->
    <div id="dock">
    <button id="panelFab" class="fab" data-icon="hub" title="Show controls" aria-label="Show controls" hidden></button>
    <aside id="panel" class="card">
      <header>
        <i class="icon" data-icon="hub"></i>
        <h1>netmap</h1>
        <span class="sub">maps of cyberspace</span>
        <button id="panelMin" class="icon-btn" data-icon="expand_less" title="Minimize" aria-label="Minimize controls"></button>
      </header>
      <div id="banner" hidden></div>

      <label class="row">
        <span>Dataset</span>
        <select id="dataset"></select>
      </label>

      <div class="group" role="radiogroup" aria-label="Layout">
        <span class="label">Layout</span>
        <div class="seg" id="mode">
          <button data-v="cyber" title="Large Graph Layout: pure topology (1)">Cyber</button>
          <button data-v="hybrid" title="Metro-concentrated ASes pinned, core placed by the graph (2)">Hybrid</button>
          <button data-v="geo" title="Every geolocated AS at its main site (3)">Geo</button>
        </div>
      </div>

      <div class="group">
        <span class="label">View</span>
        <div class="seg" id="view">
          <button data-v="map" title="2D slippy map">Map</button>
          <button data-v="globe" title="3D globe, altitude = hierarchy (G)">Globe</button>
        </div>
      </div>

      <label class="row">
        <span>Basemap</span>
        <select id="basemap">
          <option value="grid">Dark grid</option>
          <option value="osm">OpenStreetMap</option>
          <option value="none">None (black)</option>
        </select>
      </label>

      <label class="row">
        <span>Renderer</span>
        <select id="renderer">
          <option value="vector">WebGL vectors</option>
          <option value="raster">Raster tiles</option>
        </select>
      </label>

      <details open>
        <summary>Style</summary>
        <label class="row"><span>Edges</span><input id="edgeAlpha" type="range" min="0" max="100" value="5" /></label>
        <label class="row"><span>Nodes</span><input id="nodeSize" type="range" min="0" max="100" value="0" /></label>
        <label class="row" title="Links seen by traceroute-style sampling: shortest-path trees from 1 (left: a single spanning tree, the Opte look) up to 255 vantage ASes, then every link (right)"><span>Sampling</span><input id="sampling" type="range" min="0" max="100" value="0" /></label>
        <div class="hint" id="samplingLabel"></div>
        <label class="row" title="Downsample to the core: keep the most-core nodes (by hierarchy level, then degree) and the links among them, from all nodes (left) to the top 0.5% (right)"><span>Core</span><input id="core" type="range" min="0" max="100" value="0" /></label>
        <div class="hint" id="coreLabel"></div>
        <label class="row"><span>Altitude</span><input id="altitude" type="range" min="0" max="100" value="20" /></label>
        <label class="check"><input id="showTransit" type="checkbox" checked /> <span id="transitLabel">transit links (provider→customer)</span></label>
        <label class="check"><input id="showPeering" type="checkbox" checked /> peering links</label>
        <label class="check" title="Each AS's primary provider link plus the core mesh: about one link per AS, like the traceroute trees of the Opte maps"><input id="backboneOnly" type="checkbox" checked /> backbone only (Opte-style)</label>
        <label class="check" title="Hybrid and geo: draw floating ASes (global transit, CDNs, national backbones) at their points of presence, with core routes between them"><input id="pops" type="checkbox" checked /> points of presence + core routes</label>
        <label class="check" title="Merge links that join the same pair of places into one fiber, sized by log(number of links)"><input id="fibers" type="checkbox" checked /> fiber bundles</label>
        <label class="row" title="How close link ends must be to share a fiber: metro (left) to region (right)"><span>Bundle</span><input id="fiberCell" type="range" min="0" max="100" value="100" /></label>
        <label class="row"><span>Fiber width</span><input id="fiberWidth" type="range" min="0" max="100" value="10" /></label>
        <div class="hint" id="fiberLabel"></div>
        <label class="check"><input id="glow" type="checkbox" checked /> additive glow</label>
      </details>

      <ul id="legend"></ul>
      <p id="stats"></p>
    </aside>

    <!-- search rows: each is a waypoint; double-clicking a node fills the active one -->
    <div id="searchStack">
      <div class="toolbar search-row" data-k="0">
        <button class="icon-btn search-btn" data-icon="search" title="Search (/)" aria-label="Search" aria-expanded="false"></button>
        <div class="field">
          <input type="search" placeholder="Find AS number or name…" autocomplete="off" tabindex="-1" />
          <ul class="results" role="listbox"></ul>
        </div>
      </div>
      <button id="addWaypoint" class="icon-btn" data-icon="control_point" title="Add a waypoint: route from the last search to another node" aria-label="Add waypoint" disabled></button>
    </div>
    </div>

    <button id="infoFab" class="fab" data-icon="format_list_bulleted" title="Show details" aria-label="Show details" hidden></button>
    <!-- one details card per waypoint; the active one in full, the others compact -->
    <aside id="info" hidden>
      <header class="card stack-head">
        <i class="icon" data-icon="format_list_bulleted"></i>
        <span>Details</span>
        <span id="infoCount" class="sub"></span>
        <button id="infoMin" class="icon-btn" data-icon="expand_less" title="Minimize" aria-label="Minimize details"></button>
      </header>
      <div id="infoCards"></div>
    </aside>

    <div id="tooltip" hidden></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
