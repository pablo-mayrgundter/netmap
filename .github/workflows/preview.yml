# Per-PR preview at <pages-url>/pr-preview/pr-<N>/ via rossjrw/pr-preview-action.
# Each preview builds its own map bundle from the latest CAIDA snapshot (about
# a minute with the native kernels) plus shallow raster tiles, so pipeline
# changes show up in the preview, not just viewer changes. Removed when the PR
# closes.
name: preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency: preview-${{ github.ref }}

env:
  BIZDASH_REF: v0.1.1 # as in pages.yml

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: github.event.action != 'closed'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v4
        if: github.event.action != 'closed'
        with:
          path: |
            data/raw
            !data/raw/itdk-*
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - uses: actions/cache@v4
        if: github.event.action != 'closed'
        with:
          path: data/raw/itdk-*
          key: itdk-v1
      - name: Build map bundles
        if: github.event.action != 'closed'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -e "pipeline[itdk]"
          python -m netmap starlink || echo "::warning::Starlink geofeed unavailable; preview built without Starlink data"
          python -m netmap starlink-gateways || echo "::warning::gateway catalog unavailable; preview built without gateways"
          python -m netmap starlink-gp || echo "::warning::CelesTrak unavailable; preview built without an elements snapshot"
          python -m netmap build --topology caida --name internet
          python -m netmap build-itdk --name routers
          python -m netmap tiles web/public/data/internet --format webp --maxzoom 3
      - name: Build viewer
        if: github.event.action != 'closed'
        working-directory: web
        run: npm ci && npm run build
      - name: Build dashboard
        if: github.event.action != 'closed'
        run: |
          pip install "git+https://github.com/pablo-mayrgundter/bizdash@${BIZDASH_REF}"
          python -m bizdash build --site dash/site --out web/dist/dash
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./web/dist/
